<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092815"/>
      <stop offset="50%" stop-color="#144d28"/>
      <stop offset="100%" stop-color="#0c321b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2d7e48" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0c321b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3b0"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="85%" stop-color="#aa8012"/>
      <stop offset="100%" stop-color="#f5d77f"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  <rect width="600" height="800" fill="url(#glowGrad)"/>

  <!-- Subtle grid / agronomy contours -->
  <circle cx="300" cy="310" r="230" fill="none" stroke="#256b3b" stroke-width="1" stroke-dasharray="6,6" opacity="0.35"/>
  <circle cx="300" cy="310" r="190" fill="none" stroke="#2e8549" stroke-width="1.5" opacity="0.4"/>
  <circle cx="300" cy="310" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Central Executive Crest -->
  <circle cx="300" cy="310" r="135" fill="#0f3b1f" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="300" cy="310" r="124" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Doctoral / Agronomy Iconography -->
  <path d="M 280 232 L 300 220 L 320 232 L 300 244 Z" fill="url(#goldGrad)"/>
  <path d="M 285 236 L 285 254 Q 300 262 315 254 L 315 236" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M 320 233 L 327 248 L 325 264" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Monogram -->
  <text x="300" y="328" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="64" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3" filter="url(#shadow)">PH</text>
  <text x="300" y="365" font-family="'Inter', 'Arial', sans-serif" font-size="13" font-weight="700" fill="#a5d8b2" text-anchor="middle" letter-spacing="3.5">Ph.D. AGRONOMY</text>

  <!-- Lower Plaque -->
  <g transform="translate(45, 520)" filter="url(#shadow)">
    <rect width="510" height="210" rx="16" fill="#0c2e18" stroke="url(#goldBorder)" stroke-width="1.5"/>
    <rect x="15" y="15" width="480" height="180" rx="10" fill="none" stroke="#1d5c31" stroke-width="1" opacity="0.4"/>

    <!-- Gold Accent Bar -->
    <rect x="215" y="25" width="80" height="3" rx="1.5" fill="url(#goldGrad)"/>

    <text x="255" y="70" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Dr. Perli Himavarsha</text>
    
    <text x="255" y="105" font-family="'Inter', 'Arial', sans-serif" font-size="16" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0.5">Co-Founder &amp; CEO · Farmoology™</text>
    
    <text x="255" y="136" font-family="'Inter', 'Arial', sans-serif" font-size="13" font-weight="500" fill="#a8dbb5" text-anchor="middle" letter-spacing="0.4">Ph.D. Agronomist · Soil Health &amp; Regenerative Agriculture</text>

    <!-- Award Pill -->
    <g transform="translate(105, 155)">
      <rect width="300" height="28" rx="14" fill="#154224" stroke="url(#goldGrad)" stroke-width="1"/>
      <text x="150" y="19" font-family="'Inter', 'Arial', sans-serif" font-size="11.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0.8">★ YOUNG AGRONOMIST AWARD 2023 ★</text>
    </g>
  </g>
</svg>
